<style>
:root{
  --acc:#E4B75B;
  --acc-soft:rgba(228,183,91,.35);
  --ink:#F3EFE7;
  --ink-soft:rgba(243,239,231,.58);
  --card:rgba(255,255,255,.055);
  --card-border:rgba(255,255,255,.13);
  --key:rgba(255,255,255,.09);
  --paper:#F6EFE2;
  --paper-ink:#2E2418;
  --paper-soft:#8A7A5E;
  --radius:18px;
  --sans:-apple-system, "SF Pro Text", system-ui, "Segoe UI", sans-serif;
  --serif:"Cormorant Garamond", "New York", ui-serif, Georgia, serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--sans);
  color:var(--ink);
  background:#171310 center/cover no-repeat fixed;
  -webkit-user-select:none;user-select:none;
}
body:not(.with-image){
  background-image:radial-gradient(120% 90% at 50% 0%, #231C16 0%, #171310 55%, #100D0B 100%);
}
body.with-image::before{
  content:"";position:fixed;inset:0;z-index:-1;
  background:rgba(10,8,6,.5);
}
body.light-text-off{
  --ink:#241E15; --ink-soft:rgba(36,30,21,.55);
  --card:rgba(255,255,255,.6); --card-border:rgba(0,0,0,.12);
  --key:rgba(0,0,0,.06);
}
body.light-text-off.with-image::before{ background:rgba(255,252,246,.4); }
body.light-text-off:not(.with-image){ background-image:none; }

/* cielo estrellado */
#sky{position:fixed;inset:0;z-index:-2;pointer-events:none}
#sky .st{
  position:absolute;border-radius:50%;background:var(--ink);
  opacity:.25;animation:tw 4s ease-in-out infinite;
}
@keyframes tw{0%,100%{opacity:.12}50%{opacity:.5}}

#app{
  max-width:480px;margin:0 auto;min-height:100dvh;
  padding:calc(env(safe-area-inset-top) + 26px) 22px calc(env(safe-area-inset-bottom) + 34px);
}
header{text-align:center;margin-bottom:4px}
header h1{
  font-family:var(--serif);font-weight:500;font-size:2rem;
  letter-spacing:.01em;
}
header .fecha{
  color:var(--ink-soft);font-size:.8rem;margin-top:4px;
  text-transform:capitalize;letter-spacing:.08em;
}
.counter{
  display:inline-block;margin-top:12px;font-size:.78rem;font-weight:600;
  color:var(--ink-soft);border:1px solid var(--card-border);
  border-radius:999px;padding:5px 14px;letter-spacing:.03em;
}
.counter b{color:var(--acc);font-weight:700}
.counter::before{content:"✦ ";color:var(--acc);font-size:.7rem}

/* ---------- sobre ---------- */
.envelope-wrap{text-align:center;padding:36px 0 6px;position:relative}
.env-emoji{
  display:inline-block;font-size:4.4rem;line-height:1;cursor:pointer;
  transition:transform .18s ease;
  filter:drop-shadow(0 6px 14px rgba(0,0,0,.35));
  animation:flotar 3.4s ease-in-out infinite;
}
.env-emoji:active{transform:scale(.92)}
@keyframes flotar{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-6px)}
}
.spark{
  position:absolute;color:var(--acc);font-size:.65rem;opacity:.55;
  animation:tw 3.4s ease-in-out infinite;
}
.hint{
  color:var(--ink-soft);font-size:.82rem;margin-top:12px;
  font-family:var(--serif);font-style:italic;font-size:.95rem;
}
@keyframes unfold{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* iPhones angostos: menos margen = más lugar para los tableros */
@media (max-width: 390px){
  #app{padding-left:14px;padding-right:14px}
  .box{padding:14px}
}

/* ---------- carta (siempre papel) ---------- */
.letter{
  display:none;position:relative;
  background:var(--paper);color:var(--paper-ink);
  border-radius:14px;padding:26px 24px 22px;margin-top:20px;
  box-shadow:0 14px 34px rgba(0,0,0,.35);
  animation:unfold .35s ease;
}
.letter::before{
  content:"";position:absolute;inset:7px;
  border:1px solid rgba(46,36,24,.18);border-radius:9px;pointer-events:none;
}
.letter .msg{
  font-family:var(--serif);font-style:italic;font-weight:500;
  font-size:1.28rem;line-height:1.55;
}
.letter .firma{
  margin-top:16px;font-family:var(--serif);font-size:1.02rem;
  color:var(--paper-soft);text-align:right;
}

/* ---------- actividad ---------- */
.act-label{
  margin:34px 0 14px;font-size:.72rem;font-weight:700;letter-spacing:.22em;
  text-transform:uppercase;color:var(--ink-soft);
  display:flex;align-items:center;gap:12px;
}
.act-label::before,.act-label::after{
  content:"";flex:1;height:1px;
  background:linear-gradient(90deg,transparent,var(--card-border));
}
.act-label::after{background:linear-gradient(90deg,var(--card-border),transparent)}
.box{
  background:var(--card);border:1px solid var(--card-border);
  border-radius:var(--radius);padding:20px;backdrop-filter:blur(12px);
  text-align:center;
}

/* video */
.video-box{padding:0;overflow:hidden;text-align:left}
.video-box iframe{width:100%;aspect-ratio:16/9;border:none;display:block}
.video-box p{
  padding:13px 18px;font-family:var(--serif);font-style:italic;
  font-size:1.08rem;
}

/* ahorcado */
#gallows{margin:2px auto 4px;display:block}
#gallows line,#gallows circle{stroke:var(--ink);stroke-width:2.5;fill:none;stroke-linecap:round}
#gallows .part{visibility:hidden}
.word{
  font-family:var(--serif);letter-spacing:.34em;font-size:1.8rem;
  font-weight:600;margin:12px 0 16px;
}
.kbd{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.kbd button{
  width:33px;height:40px;border:1px solid var(--card-border);border-radius:9px;
  background:var(--key);color:var(--ink);
  font-family:var(--sans);font-weight:600;font-size:.95rem;cursor:pointer;
  transition:opacity .15s ease;
}
.kbd button:disabled{opacity:.2}
.result{font-weight:600;margin-top:14px;min-height:1.3em;font-size:1rem;font-family:var(--serif);font-style:italic}
.result.ok{color:#8BC79A}
.result.bad{color:#DB8A7C}
.btn{
  border:none;background:var(--acc);color:#241A08;
  font-family:var(--sans);font-weight:700;font-size:.88rem;
  padding:11px 24px;border-radius:12px;margin-top:14px;cursor:pointer;
  letter-spacing:.02em;
}
.btn:active{filter:brightness(.88)}
.btn:disabled{opacity:.4}

/* sopa */
#sopaGrid{display:grid;gap:3px;justify-content:center;margin:6px auto}
#sopaGrid div{
  width:32px;height:32px;display:flex;align-items:center;justify-content:center;
  background:var(--key);border:1px solid var(--card-border);border-radius:7px;
  font-weight:600;font-size:.92rem;cursor:pointer;
}
#sopaGrid div.sel{background:var(--acc);color:#241A08;border-color:var(--acc)}
#sopaGrid div.found{background:rgba(139,199,154,.22);border-color:rgba(139,199,154,.55)}
.sopa-words{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.sopa-words span{
  border:1px solid var(--card-border);border-radius:999px;padding:4px 13px;
  font-weight:600;font-size:.78rem;color:var(--ink-soft);letter-spacing:.05em;
}
.sopa-words span.done{text-decoration:line-through;opacity:.35}
.note{
  font-size:.92rem;color:var(--ink-soft);margin-bottom:10px;
  font-family:var(--serif);font-style:italic;
}

/* carta sellada */
.letter.sellada .msg{
  font-size:1.05rem;text-align:center;padding:8px 0;
}
.letter.sellada .firma{display:none}
.sello-icon{font-size:1.6rem;color:var(--acc);text-align:center;margin-bottom:6px}

/* trivia */
.trivia-q{font-family:var(--serif);font-style:italic;font-size:1.15rem;margin-bottom:14px;line-height:1.4}
.trivia-op{
  display:block;width:100%;margin:8px 0;padding:12px 14px;
  border:1px solid var(--card-border);border-radius:12px;background:var(--key);
  color:var(--ink);font-family:var(--sans);font-weight:600;font-size:.95rem;
  cursor:pointer;text-align:left;
}
.trivia-op:disabled{opacity:.45}
.trivia-op.ok{background:rgba(139,199,154,.25);border-color:rgba(139,199,154,.6);opacity:1}
.trivia-op.bad{background:rgba(219,138,124,.22);border-color:rgba(219,138,124,.55);opacity:1}

/* cupón */
.cupon{
  border:1.5px dashed var(--acc);border-radius:14px;padding:20px 16px;
  margin:4px 2px;position:relative;
}
.cupon .tag{
  font-size:.68rem;font-weight:700;letter-spacing:.24em;text-transform:uppercase;
  color:var(--acc);margin-bottom:8px;
}
.cupon .txt{font-family:var(--serif);font-style:italic;font-size:1.25rem;line-height:1.4}
.cupon .canjeado{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-12deg);
  border:2px solid #8BC79A;color:#8BC79A;border-radius:8px;
  padding:4px 14px;font-weight:800;letter-spacing:.14em;font-size:.9rem;
  background:rgba(0,0,0,.25);backdrop-filter:blur(2px);
}

/* foto polaroid */
.polaroid{
  background:var(--paper);padding:12px 12px 16px;border-radius:6px;
  box-shadow:0 12px 30px rgba(0,0,0,.35);max-width:320px;margin:4px auto;
  transform:rotate(-1.5deg);
}
.polaroid img{width:100%;border-radius:3px;display:block}
.polaroid p{
  font-family:var(--serif);font-style:italic;color:var(--paper-ink);
  font-size:1.05rem;margin-top:10px;
}

/* misión */
.mision-txt{font-family:var(--serif);font-style:italic;font-size:1.18rem;line-height:1.5;margin-bottom:6px}

/* simon */
#simonPads{display:grid;grid-template-columns:repeat(2,96px);gap:10px;justify-content:center;margin:8px auto}
.simon-pad{
  width:96px;height:96px;border-radius:18px;border:1px solid var(--card-border);
  cursor:pointer;opacity:.55;transition:opacity .12s ease, transform .12s ease;
}
.simon-pad:active{transform:scale(.95)}
.simon-pad.lit{opacity:1;box-shadow:0 0 22px var(--acc-soft)}
.simon-ronda{font-weight:700;color:var(--acc);margin-bottom:6px;letter-spacing:.06em;font-size:.85rem}

/* atrapar estrellas */
#atraparZona{
  position:relative;height:260px;border:1px solid var(--card-border);
  border-radius:14px;background:rgba(0,0,0,.14);overflow:hidden;margin:8px 0;
}
.atrapar-star{
  position:absolute;font-size:1.9rem;cursor:pointer;user-select:none;
  animation:aparecer .18s ease;transition:transform .1s ease;
  padding:6px;line-height:1;
}
.atrapar-star:active{transform:scale(1.35)}
@keyframes aparecer{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.atrapar-hud{display:flex;justify-content:space-between;font-weight:700;color:var(--acc);font-size:.9rem;padding:0 4px}

/* puzzle deslizante */
#puzzleGrid{display:grid;grid-template-columns:repeat(3,74px);gap:6px;justify-content:center;margin:8px auto}
.pz-tile{
  width:74px;height:74px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  background:var(--key);border:1px solid var(--card-border);cursor:pointer;
  font-family:var(--serif);font-size:1.7rem;font-weight:600;color:var(--acc);
  transition:transform .12s ease, background .2s ease;
}
.pz-tile:active{transform:scale(.95)}
.pz-tile.vacia{background:transparent;border-color:transparent;cursor:default}

/* piedra papel tijera */
.ppt-ops{display:flex;gap:12px;justify-content:center;margin:10px 0 4px}
.ppt-ops button{
  font-size:2.2rem;width:76px;height:76px;border-radius:18px;cursor:pointer;
  background:var(--key);border:1px solid var(--card-border);
  transition:transform .12s ease;
}
.ppt-ops button:active{transform:scale(.92)}
.ppt-ops button:disabled{opacity:.35}
.ppt-marcador{font-weight:700;color:var(--acc);font-size:1rem;margin-top:6px}
.ppt-jugada{font-size:1.5rem;min-height:1.6em;margin-top:8px}

/* ================== LORO (deluxe) ================== */
.loro-escena{text-align:center;padding:10px 0 4px;position:relative}
#loroSvg{width:min(86vw,340px);height:auto;cursor:pointer;transition:transform .12s ease}
#loroSvg:active{transform:scale(.965)}
#loroSvg [class^="l-"], #loroSvg [class*=" l-"]{transform-box:fill-box}
/* mecida general, como colgado de la rama */
.l-todo{transform-origin:50% 94%;animation:lMecer 4.4s ease-in-out infinite}
@keyframes lMecer{0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(1.4deg)}}
/* respiración del cuerpo */
.l-cuerpo-g{transform-origin:50% 85%;animation:lRespirar 3.1s ease-in-out infinite}
@keyframes lRespirar{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,1.028)}}
/* cabeceo curioso, con pausas */
.l-cabeza{transform-origin:35% 95%;animation:lCabecear 6.8s ease-in-out infinite}
@keyframes lCabecear{0%,55%,100%{transform:rotate(0)}62%{transform:rotate(-4deg)}70%{transform:rotate(-4deg)}78%{transform:rotate(2.5deg)}86%{transform:rotate(0)}}
/* cola con vaivén propio */
.l-cola{transform-origin:80% 8%;animation:lColear 3.7s ease-in-out infinite}
@keyframes lColear{0%,100%{transform:rotate(2.4deg)}50%{transform:rotate(-2.8deg)}}
/* parpadeo doble ocasional */
.l-parpado{transform-origin:50% 50%;transform:scaleY(0);animation:lParpadeo 5.2s infinite}
@keyframes lParpadeo{0%,90.5%,93.5%,95.5%,98.5%,100%{transform:scaleY(0)}91.5%,92.5%{transform:scaleY(1)}96.5%,97.5%{transform:scaleY(1)}}
/* mirada de reojo cada tanto */
.l-pupila{animation:lMirar 7.6s ease-in-out infinite}
@keyframes lMirar{0%,58%,86%,100%{transform:translateX(0)}64%,78%{transform:translateX(-2.6px)}}
/* micro-movimiento del ala y la cresta en reposo */
.l-ala-g{animation:lAlaIdle 5.6s ease-in-out infinite}
@keyframes lAlaIdle{0%,100%{transform:rotate(0)}50%{transform:rotate(-2deg)}}
.l-cresta{animation:lCrestaIdle 4.8s ease-in-out infinite}
@keyframes lCrestaIdle{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(2deg)}}
/* --- al hablar --- */
.loro-habla .l-squash{transform-origin:50% 90%;animation:lSquash .55s ease}
@keyframes lSquash{0%,100%{transform:scale(1,1)}30%{transform:scale(1.045,.94)}60%{transform:scale(.985,1.02)}}
.loro-habla .l-pico-inf{animation:lPicoInf .55s ease}
.l-pico-inf{transform-origin:12% 20%}
@keyframes lPicoInf{0%,100%{transform:rotate(0)}30%{transform:rotate(16deg)}55%{transform:rotate(7deg)}80%{transform:rotate(12deg)}}
.loro-habla .l-pico-sup{animation:lPicoSup .55s ease}
.l-pico-sup{transform-origin:10% 80%}
@keyframes lPicoSup{0%,100%{transform:rotate(0)}30%{transform:rotate(-5deg)}60%{transform:rotate(-2deg)}}
.loro-habla .l-ala-g{animation:lAletear .62s ease}
.l-ala-g{transform-origin:22% 12%}
@keyframes lAletear{0%,100%{transform:rotate(0)}28%{transform:rotate(-44deg)}55%{transform:rotate(10deg)}78%{transform:rotate(-8deg)}}
.loro-habla .l-af2{animation:lPluma .62s ease}
.loro-habla .l-af3{animation:lPluma .62s ease .06s}
.l-af2,.l-af3{transform-origin:20% 15%}
@keyframes lPluma{0%,100%{transform:rotate(0)}35%{transform:rotate(-9deg)}65%{transform:rotate(4deg)}}
.loro-habla .l-cresta{animation:lCresta .55s ease}
.l-cresta{transform-origin:50% 100%}
@keyframes lCresta{0%,100%{transform:scale(1) translateY(0)}35%{transform:scale(1.12,1.25) translateY(-3px)}}
/* --- charla continua: mientras dura el audio --- */
.loro-hablando .l-pico-inf{animation:lPicoLoop .3s ease-in-out infinite}
@keyframes lPicoLoop{0%,100%{transform:rotate(3deg)}50%{transform:rotate(15deg)}}
.loro-hablando .l-pico-sup{animation:lPicoSupLoop .3s ease-in-out infinite}
@keyframes lPicoSupLoop{0%,100%{transform:rotate(0)}50%{transform:rotate(-4deg)}}
.loro-hablando .l-cabeza{animation:lCabezaHabla .6s ease-in-out infinite}
@keyframes lCabezaHabla{0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(1.6deg)}}
/* partículas */
.loro-nota{
  position:absolute;font-size:1.6rem;color:var(--acc);pointer-events:none;
  animation:notaSube 1.4s ease-out forwards;text-shadow:0 2px 8px rgba(0,0,0,.25);
}
.loro-chispa{
  position:absolute;font-size:.9rem;color:var(--acc);pointer-events:none;
  animation:chispaPop .9s ease-out forwards;
}
@keyframes notaSube{
  0%{opacity:0;transform:translateY(6px) rotate(-6deg) scale(.7)}
  15%{opacity:1}
  100%{opacity:0;transform:translateY(-100px) rotate(16deg) scale(1.15)}
}
@keyframes chispaPop{
  0%{opacity:0;transform:scale(.3)}
  30%{opacity:1;transform:scale(1.25)}
  100%{opacity:0;transform:scale(.5) translateY(-26px)}
}
.loro-hint{
  color:var(--ink-soft);font-family:var(--serif);font-style:italic;
  font-size:1rem;margin-top:8px;
}

/* ================== MODOS RADICALES ================== */
/* modo terminal (hacker) */
body.modo-terminal{
  --acc:#29FF7A; --acc-soft:rgba(41,255,122,.3);
  --ink:#29FF7A; --ink-soft:rgba(41,255,122,.55);
  --card:rgba(41,255,122,.05); --card-border:rgba(41,255,122,.4);
  --key:rgba(41,255,122,.08);
  --paper:#03140A; --paper-ink:#29FF7A; --paper-soft:rgba(41,255,122,.6);
  --sans:ui-monospace,"SF Mono",Menlo,monospace;
  --serif:ui-monospace,"SF Mono",Menlo,monospace;
  background:#000!important;background-image:none!important;
}
body.modo-terminal::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:98;
  background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(0,0,0,.22) 2px 4px);
}
body.modo-terminal .box,body.modo-terminal .letter{border-radius:4px;box-shadow:none}
body.modo-terminal .letter{border:1px solid var(--card-border)}
body.modo-terminal .letter::before{display:none}
body.modo-terminal .btn{background:transparent;color:var(--acc);border:1px solid var(--acc);border-radius:4px}
body.modo-terminal header h1::before{content:"> "}
body.modo-terminal header h1{font-size:1.4rem;letter-spacing:.05em}
body.modo-terminal .env-emoji{filter:grayscale(1) sepia(1) hue-rotate(80deg) saturate(6) drop-shadow(0 0 10px rgba(41,255,122,.5))}
body.modo-terminal #sky{display:none}

/* modo papel (diario) */
body.modo-papel{
  --acc:#A34A2A; --acc-soft:rgba(163,74,42,.25);
  --ink:#2E2418; --ink-soft:rgba(46,36,24,.55);
  --card:#FFFDF7; --card-border:rgba(46,36,24,.2);
  --key:rgba(46,36,24,.06);
  --paper:#FFFDF7; --paper-ink:#2E2418; --paper-soft:#A34A2A;
  background:#F0E9DA!important;
  background-image:repeating-linear-gradient(0deg,transparent 0 27px,rgba(46,36,24,.05) 27px 28px)!important;
}
body.modo-papel #sky{display:none}
body.modo-papel .box{box-shadow:3px 4px 0 rgba(46,36,24,.12);border-radius:6px;backdrop-filter:none}
body.modo-papel .box:nth-of-type(odd){transform:rotate(-.5deg)}
body.modo-papel .letter{border-radius:4px;box-shadow:4px 5px 0 rgba(46,36,24,.15)}
body.modo-papel .letter::before{border-left:2px solid rgba(163,74,42,.35);inset:7px auto 7px 34px;border-top:none;border-right:none;border-bottom:none;border-radius:0}
body.modo-papel .env-emoji{filter:sepia(.5)}
body.modo-papel header h1{font-size:2.2rem}

/* modo arcade (neón) */
body.modo-arcade{
  --acc:#FF3D9A; --acc-soft:rgba(255,61,154,.4);
  --ink:#EDE9FF; --ink-soft:rgba(237,233,255,.6);
  --card:rgba(41,217,255,.05); --card-border:rgba(41,217,255,.45);
  --key:rgba(41,217,255,.1);
  --paper:#160B26; --paper-ink:#EDE9FF; --paper-soft:#29D9FF;
  --sans:ui-monospace,"SF Mono",Menlo,monospace;
  --serif:ui-monospace,"SF Mono",Menlo,monospace;
  background:#0B0517!important;
  background-image:radial-gradient(80% 60% at 50% -10%, #221040 0%, #0B0517 60%)!important;
}
body.modo-arcade .box{box-shadow:0 0 16px rgba(41,217,255,.18), inset 0 0 14px rgba(41,217,255,.06)}
body.modo-arcade .letter{border:1px solid rgba(255,61,154,.5);box-shadow:0 0 22px rgba(255,61,154,.25)}
body.modo-arcade .letter::before{display:none}
body.modo-arcade .btn{box-shadow:0 0 14px var(--acc-soft);text-transform:uppercase;letter-spacing:.1em;color:#fff;background:var(--acc)}
body.modo-arcade header h1{text-transform:uppercase;letter-spacing:.16em;font-size:1.5rem;text-shadow:0 0 14px var(--acc-soft)}
body.modo-arcade .env-emoji{filter:drop-shadow(0 0 12px rgba(41,217,255,.7))}
body.modo-arcade #sky .st{background:#29D9FF}

/* modo cielo (día) */
body.modo-cielo{
  --acc:#2E6FA8; --acc-soft:rgba(46,111,168,.3);
  --ink:#1F3040; --ink-soft:rgba(31,48,64,.55);
  --card:rgba(255,255,255,.72); --card-border:rgba(31,48,64,.15);
  --key:rgba(31,48,64,.06);
  --paper:#FFFFFF; --paper-ink:#1F3040; --paper-soft:#2E6FA8;
  background:#BFD9F2!important;
  background-image:linear-gradient(180deg,#A9CBEC 0%,#D8E9F8 55%,#F4F9FE 100%)!important;
}
body.modo-cielo #sky{display:none}
body.modo-cielo .box{backdrop-filter:blur(8px);box-shadow:0 10px 26px rgba(46,111,168,.15)}
body.modo-cielo .letter{box-shadow:0 12px 30px rgba(46,111,168,.2)}
.nube{
  position:fixed;z-index:-1;pointer-events:none;opacity:.85;
  animation:derivar linear infinite;
}
@keyframes derivar{
  from{transform:translateX(-18vw)}
  to{transform:translateX(118vw)}
}

/* ================== JUEGOS NUEVOS ================== */
/* crucigrama */
#cruciWrap{overflow-x:auto;padding-bottom:6px}
#cruciGrid{display:grid;gap:2px;justify-content:center;margin:6px auto;width:max-content}
.cr-cell{
  display:flex;align-items:center;justify-content:center;
  background:var(--key);border:1px solid var(--card-border);border-radius:4px;
  font-weight:700;font-size:.62rem;color:var(--ink);position:relative;
}
.cr-cell.negra{background:transparent;border-color:transparent}
.cr-cell.llena{background:rgba(139,199,154,.25);border-color:rgba(139,199,154,.55)}
.cr-cell .num{position:absolute;top:0;left:1.5px;font-size:.42rem;color:var(--acc);font-weight:700}
.cr-pistas{text-align:left;margin-top:12px;display:flex;flex-direction:column;gap:6px}
.cr-pista{
  border:1px solid var(--card-border);border-radius:10px;background:var(--key);
  color:var(--ink);font-family:var(--sans);font-weight:600;font-size:.82rem;
  padding:9px 12px;cursor:pointer;text-align:left;
}
.cr-pista.activa{border-color:var(--acc);background:var(--acc-soft)}
.cr-pista.hecha{opacity:.45;text-decoration:line-through}
.cr-input{display:flex;gap:8px;margin-top:12px}
.cr-input input, .juego-input input{
  flex:1;min-width:0;border:1px solid var(--card-border);border-radius:10px;
  background:var(--key);color:var(--ink);font-family:var(--sans);
  font-size:1rem;font-weight:600;padding:10px 12px;outline:none;
  text-transform:uppercase;
}
.juego-input{display:flex;gap:8px;margin-top:10px;justify-content:center}
.juego-input .btn{margin-top:0}

/* orden de frase */
.orden-zona{min-height:46px;border:1px dashed var(--card-border);border-radius:12px;
  display:flex;flex-wrap:wrap;gap:6px;padding:8px;margin:8px 0;justify-content:center}
.orden-chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.orden-chip{
  border:1px solid var(--card-border);border-radius:999px;background:var(--key);
  color:var(--ink);font-family:var(--sans);font-weight:700;font-size:.88rem;
  padding:8px 14px;cursor:pointer;
}
.orden-zona .orden-chip{background:var(--acc);color:#241A08;border-color:var(--acc)}

/* reaccion */
#reacZona{
  height:180px;border-radius:14px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;cursor:pointer;
  background:var(--key);border:1px solid var(--card-border);
  font-weight:700;font-size:1.1rem;user-select:none;margin:8px 0;gap:6px;
}
#reacZona.listo{background:rgba(139,199,154,.4);border-color:rgba(139,199,154,.8)}
#reacZona.esperando{background:rgba(219,138,124,.18)}

/* topo */
#topoGrid{display:grid;grid-template-columns:repeat(3,84px);gap:8px;justify-content:center;margin:8px auto}
.topo-hoyo{
  width:84px;height:84px;border-radius:16px;background:var(--key);
  border:1px solid var(--card-border);font-size:2.4rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.topo-hoyo:active{transform:scale(.95)}

/* cajafuerte */
.caja-intentos{display:flex;flex-direction:column;gap:6px;margin:10px 0;align-items:center}
.caja-fila{display:flex;gap:6px}
.caja-dig{
  width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:1.2rem;border:1px solid var(--card-border);background:var(--key);color:var(--ink);
}
.caja-dig.ok{background:rgba(139,199,154,.45);border-color:rgba(139,199,154,.8)}
.caja-dig.casi{background:rgba(228,183,91,.4);border-color:rgba(228,183,91,.8)}

/* verdad o falso */
.vf-frase{font-family:var(--serif);font-style:italic;font-size:1.15rem;line-height:1.4;margin:10px 0;min-height:2.6em}
.vf-btns{display:flex;gap:12px;justify-content:center}
.vf-btns .btn{margin-top:0;min-width:110px}
.vf-prog{font-size:.8rem;color:var(--ink-soft);font-weight:700;letter-spacing:.08em}

/* intruso */
#intrusoGrid{display:grid;gap:6px;justify-content:center;margin:8px auto}
.in-cel{
  width:52px;height:52px;border-radius:12px;background:var(--key);
  border:1px solid var(--card-border);font-size:1.6rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.in-cel:active{transform:scale(.93)}

/* emojis (adivinar) */
.emo-big{font-size:3rem;letter-spacing:.1em;margin:6px 0 12px}

/* wordle */
.wd-filas{display:flex;flex-direction:column;gap:6px;margin:10px 0;align-items:center}
/* (usa .caja-fila y .caja-dig de la cajafuerte) */

/* nexos */
#nxSolved{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.nx-grupo{border-radius:12px;padding:10px 12px;color:#241A08;text-align:center}
.nx-grupo b{display:block;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase}
.nx-grupo span{font-weight:600;font-size:.85rem}
#nxGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.nx-chip{
  border:1px solid var(--card-border);border-radius:10px;background:var(--key);
  color:var(--ink);font-family:var(--sans);font-weight:700;font-size:.72rem;
  padding:12px 2px;cursor:pointer;text-align:center;overflow:hidden;text-overflow:ellipsis;
}
.nx-chip.sel{background:var(--acc);color:#241A08;border-color:var(--acc)}
.nx-vidas{font-size:.85rem;color:var(--ink-soft);font-weight:700;margin-top:10px;letter-spacing:.15em}

/* snake */
#snakeCanvas{width:100%;max-width:320px;border-radius:14px;background:rgba(0,0,0,.22);border:1px solid var(--card-border);touch-action:none;display:block;margin:0 auto}
/* rompecabezas con foto (intercambio y deslizante) */
.fz-grid{display:grid;gap:2px;justify-content:center;margin:8px auto;touch-action:manipulation}
.fz-tile{
  background-repeat:no-repeat;border-radius:4px;cursor:pointer;
  outline:1px solid rgba(0,0,0,.25);transition:transform .1s ease, outline .15s ease;
}
.fz-tile:active{transform:scale(.96)}
.fz-tile.sel{outline:3px solid var(--acc);z-index:2}
.fz-tile.hueco{background:rgba(0,0,0,.3)!important;background-image:none!important;cursor:default;outline:1px dashed var(--card-border)}
.fz-listo .fz-tile{outline:none;border-radius:0;cursor:default}
.fz-marco{display:inline-block;border-radius:10px;overflow:hidden;box-shadow:0 10px 28px rgba(0,0,0,.35)}

/* eventos raros del caos */
.fugaz{
  position:fixed;z-index:1;pointer-events:none;color:var(--acc);
  font-size:1rem;opacity:0;animation:cruzar 1.6s ease-in forwards;
}
@keyframes cruzar{
  0%{opacity:0;transform:translate(0,0) rotate(-32deg)}
  12%{opacity:.9}
  100%{opacity:0;transform:translate(-46vw,52vh) rotate(-32deg)}
}
body.caos-gigante .env-emoji{font-size:6.4rem}
body.caos-inclinada #app{transform:rotate(-.8deg)}
.estado{
  color:var(--ink-soft);font-size:.78rem;margin-top:6px;
  font-family:var(--serif);font-style:italic;
}

/* memoria (memotest) */
#memGrid{display:grid;gap:8px;justify-content:center;margin:6px auto}
.mem-card{
  width:64px;height:64px;border-radius:12px;cursor:pointer;
  background:var(--key);border:1px solid var(--card-border);
  display:flex;align-items:center;justify-content:center;
  font-size:1.7rem;color:var(--acc);
  transition:transform .15s ease, background .2s ease;
}
.mem-card:active{transform:scale(.94)}
.mem-card.flip{background:var(--card);border-color:var(--acc-soft)}
.mem-card.done{background:rgba(139,199,154,.18);border-color:rgba(139,199,154,.5);cursor:default}

/* ruleta */
.ruleta-wrap{position:relative;width:250px;margin:10px auto 4px}
.ruleta-pointer{
  position:absolute;top:-6px;left:50%;transform:translateX(-50%);
  font-size:1.4rem;color:var(--acc);z-index:2;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.4));
}
#ruletaWheel{
  width:250px;height:250px;border-radius:50%;
  border:3px solid var(--acc);position:relative;overflow:hidden;
  transition:transform 3.4s cubic-bezier(.15,.9,.22,1);
  box-shadow:0 10px 30px rgba(0,0,0,.35);
}
.ruleta-label{
  position:absolute;top:50%;left:50%;width:0;height:0;
  display:flex;align-items:center;justify-content:center;
}
.ruleta-label span{
  display:block;white-space:nowrap;font-weight:700;font-size:.72rem;
  color:#241A08;letter-spacing:.02em;max-width:96px;overflow:hidden;
  text-overflow:ellipsis;
}
.ruleta-res{
  font-family:var(--serif);font-style:italic;font-size:1.3rem;
  margin-top:14px;min-height:1.5em;color:var(--acc);font-weight:600;
}

/* rascar */
.rascar-wrap{position:relative;max-width:320px;margin:6px auto;border-radius:14px;overflow:hidden}
.rascar-premio{
  background:var(--paper);color:var(--paper-ink);
  font-family:var(--serif);font-style:italic;font-size:1.25rem;line-height:1.45;
  padding:34px 22px;border-radius:14px;
}
#rascarCanvas{
  position:absolute;inset:0;width:100%;height:100%;
  touch-action:none;cursor:crosshair;border-radius:14px;
  transition:opacity .6s ease;
}

/* confetti de estrellas */
.confetti-star{
  position:fixed;top:-24px;z-index:99;pointer-events:none;
  color:var(--acc);animation:caer linear forwards;
}
@keyframes caer{
  to{transform:translateY(110vh) rotate(540deg);opacity:0}
}

/* modo fiesta (días especiales) */
body.fiesta header h1{color:var(--acc)}
body.fiesta .counter{border-color:var(--acc-soft)}
.fiesta-badge{
  display:inline-block;margin-top:10px;color:var(--acc);
  font-family:var(--serif);font-style:italic;font-size:1rem;
  animation:tw 2.8s ease-in-out infinite;
}
</style>
</head>
<body>
<div id="sky"></div>
<div id="app">

  <header>
    <h1 id="saludo"></h1>
    <div class="fecha" id="fecha"></div>
    <div class="estado" id="estadoApp" style="display:none"></div>
    <div>
      <span class="counter" id="counter" style="display:none"><b id="dias"></b>&nbsp;días juntos</span>
      <span class="counter" id="countdown" style="display:none"></span>
    </div>
    <div class="fiesta-badge" id="fiestaBadge" style="display:none">✦ hoy es un día especial ✦</div>
  </header>

  <div class="envelope-wrap" id="envWrap">
    <div id="envelope" class="env-emoji" role="button" aria-label="Abrir mensaje del día">✉️</div>
    <p class="hint">tocá el sobre y leé lo de hoy</p>
  </div>

  <div class="letter" id="letter">
    <div class="msg" id="letterMsg"></div>
    <div class="firma" id="letterFirma"></div>
  </div>

  <div class="act-label" id="actLabel" style="display:none">Hoy toca</div>
  <div id="actividad"></div>

</div>

<script>
/* ---------- utilidades ---------- */
function fechaHoy(){
  const d=new Date();
  const p=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function ytId(url){
  if(!url) return "";
  if(/^[\w-]{11}$/.test(url)) return url;
  const m=url.match(/(?:v=|youtu\.be\/|shorts\/|embed\/)([\w-]{11})/);
  return m ? m[1] : "";
}
function luminancia(hex){
  const h=hex.replace("#","");
  const f=h.length===3 ? h.split("").map(c=>c+c).join("") : h;
  const n=parseInt(f,16);
  return (0.299*((n>>16)&255)+0.587*((n>>8)&255)+0.114*(n&255))/255;
}
/* rutas: anteponen la carpeta configurada (si hay) a los nombres de archivo */
function conCarpeta(base,f){
  if(!f||/^https?:/i.test(f)||f.includes("/")) return f;
  const c=String(base||"").trim();
  return c ? c.replace(/\/?$/,"/")+f : f;
}
const rutaAudio=f=>conCarpeta(CONFIG.carpetaAudios,f);
const rutaFoto=f=>conCarpeta(CONFIG.carpetaFotos,f);

/* ---------- motor de caos: decide el look del día ---------- */
function hashTxt(s){ let h=7; for(const c of s) h=((h*31)+c.charCodeAt(0))>>>0; return h; }
function elegir(arr,sal){ return arr && arr.length ? arr[hashTxt(fechaHoy()+sal)%arr.length] : null; }
const CAOS=(function(){
  const c=CONFIG.caos||{};
  if(c.activo===false) return {activo:false};
  const quirks=["nada","nada","nada","fugaz","corazones","gigante","inclinada"];
  return {
    activo:true,
    tema: elegir(c.temas,"t"),
    sobre: elegir(c.sobres,"s"),
    frase: elegir(c.frases,"f"),
    estado: elegir(c.estados,"e"),
    quirk: elegir(quirks,"q")
  };
})();

/* ---------- fondo, tema y cielo ---------- */
(function(){
  const f=CONFIG.fondo||{};
  let claro=true;
  if(f.imagen){
    document.body.style.backgroundImage=`url("${f.imagen}")`;
    document.body.classList.add("with-image");
    claro = f.textoClaro!==false;
  } else {
    const col=f.color||"#171310";
    document.body.style.backgroundColor=col;
    claro = luminancia(col) < 0.55;
    if(f.estrellas!==false){
      const sky=document.getElementById("sky");
      const corazones = CAOS.activo && CAOS.quirk==="corazones";
      for(let i=0;i<16;i++){
        const s=document.createElement("span");
        s.className="st";
        const size=(Math.random()*1.6+1).toFixed(1);
        s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;`+
          `width:${size}px;height:${size}px;animation-delay:${(Math.random()*4).toFixed(1)}s;`+
          `animation-duration:${(3+Math.random()*3).toFixed(1)}s`;
        if(corazones){
          s.textContent="♥";
          s.style.background="none";
          s.style.fontSize=(7+Math.random()*6).toFixed(0)+"px";
          s.style.width="auto"; s.style.height="auto";
        }
        sky.appendChild(s);
      }
    }
  }
  if(!claro) document.body.classList.add("light-text-off");
})();

/* ---------- encabezado ---------- */
document.getElementById("fecha").textContent =
  new Date().toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"long"});

if(CONFIG.aniversario){
  const dias=Math.max(0,Math.floor((new Date() - new Date(CONFIG.aniversario+"T00:00:00"))/86400000));
  document.getElementById("dias").textContent=dias;
  document.getElementById("counter").style.display="inline-block";
}

/* ---------- memoria local (recuerda cupones, sellos y ruletas) ---------- */
function guardar(k,v){ try{ localStorage.setItem("pv-"+k,v); }catch(e){} }
function leer(k){ try{ return localStorage.getItem("pv-"+k); }catch(e){ return null; } }

/* ---------- día actual ---------- */
const diaHoy = CONFIG.dias[fechaHoy()] || CONFIG.porDefecto;
document.getElementById("saludo").textContent = "Hola, " + (diaHoy.nombre || CONFIG.nombre);
document.getElementById("letterFirma").textContent = diaHoy.firma || CONFIG.firma || "— para vos";

/* modo radical del día (terminal / papel / arcade / cielo) */
const MODOS={terminal:true, papel:false, arcade:true, cielo:false};
const modoHoy = diaHoy.modo && (diaHoy.modo in MODOS) ? diaHoy.modo : null;
if(modoHoy){
  document.body.classList.add("modo-"+modoHoy);
  document.body.classList.remove("with-image");
  document.body.classList.toggle("light-text-off", !MODOS[modoHoy]);
  if(modoHoy==="cielo"){
    for(let i=0;i<5;i++){
      const n=document.createElement("span");
      n.className="nube"; n.textContent="☁️";
      n.style.top=(4+Math.random()*40)+"%";
      n.style.fontSize=(1.6+Math.random()*2.2)+"rem";
      n.style.animationDuration=(46+Math.random()*50)+"s";
      n.style.animationDelay=(-Math.random()*60)+"s";
      document.body.appendChild(n);
    }
  }
}

/* tema del día: el del día puntual gana; si no hay (y no hay modo), el caos elige */
const temaDia = modoHoy ? null : (diaHoy.tema || (CAOS.activo && !(CONFIG.fondo&&CONFIG.fondo.imagen) ? CAOS.tema : null));
if(temaDia){
  const t=temaDia;
  if(t.fondo){
    document.body.style.backgroundColor=t.fondo;
    document.body.style.backgroundImage="none";
    document.body.classList.remove("with-image");
    document.body.classList.toggle("light-text-off", luminancia(t.fondo)>=0.55);
  }
  if(t.acento && /^#[0-9a-fA-F]{6}$/.test(t.acento)){
    const r=document.documentElement.style;
    r.setProperty("--acc",t.acento);
    r.setProperty("--acc-soft",t.acento+"59");
  }
}

/* resto del caos: sobre, frases y eventos raros (no en días con modo) */
if(CAOS.activo && !modoHoy){
  if(CAOS.sobre) document.getElementById("envelope").textContent=CAOS.sobre;
  if(CAOS.frase) document.querySelector(".hint").textContent=CAOS.frase;
  if(CAOS.estado){
    const e=document.getElementById("estadoApp");
    e.textContent=CAOS.estado; e.style.display="block";
  }
  if(CAOS.quirk==="gigante") document.body.classList.add("caos-gigante");
  if(CAOS.quirk==="inclinada") document.body.classList.add("caos-inclinada");
  if(CAOS.quirk==="fugaz"){
    const tirar=()=>{
      const s=document.createElement("span");
      s.className="fugaz"; s.textContent="✦";
      s.style.top=(5+Math.random()*30)+"%";
      s.style.right=(-4+Math.random()*20)+"%";
      document.body.appendChild(s);
      setTimeout(()=>s.remove(),1800);
    };
    setTimeout(tirar,2500);
    setInterval(tirar,17000);
  }
}

const act=diaHoy.actividad;
const puedeSellar = act && ["ahorcado","sopa","trivia","memoria","ruleta","rascar","simon","atrapar","puzzle","ppt","mentira","crucigrama","adivinanza","emojis","orden","numero","reaccion","topo","cajafuerte","verdadfalso","intruso","wordle","nexos","snake","fotopuzzle","deslizante"].includes(act.tipo);
let sellado = diaHoy.sellado===true && puedeSellar && leer("sello-"+fechaHoy())!=="abierto";
let cartaTipeada = false;

function pintarCarta(){
  const l=document.getElementById("letter");
  if(sellado){
    l.classList.add("sellada");
    document.getElementById("letterMsg").innerHTML =
      '<div class="sello-icon">✦</div>El mensaje de hoy está sellado.<br>Completá el juego de acá abajo para abrirlo.';
  } else {
    l.classList.remove("sellada");
    document.getElementById("letterMsg").textContent = diaHoy.mensaje||"";
  }
}
pintarCarta();

/* carta que se escribe sola */
function tipearCarta(){
  if(cartaTipeada || sellado || diaHoy.escribir!==true) return;
  cartaTipeada=true;
  const el=document.getElementById("letterMsg");
  const txt=diaHoy.mensaje;
  el.textContent="";
  let i=0;
  const iv=setInterval(()=>{
    el.textContent=txt.slice(0,++i);
    if(i>=txt.length) clearInterval(iv);
  },34);
}

document.getElementById("envelope").addEventListener("click",()=>{
  const l=document.getElementById("letter");
  const abrir = l.style.display!=="block";
  l.style.display = abrir ? "block" : "none";
  if(abrir) tipearCarta();
});

/* ---------- cuenta regresiva ---------- */
(function(){
  const ev=CONFIG.proximoEvento;
  if(!ev || !ev.fecha) return;
  const n=Math.ceil((new Date(ev.fecha+"T00:00:00") - new Date())/86400000);
  if(n<0) return;
  const cd=document.getElementById("countdown");
  cd.textContent = n===0 ? "¡hoy es el día!" :
    n===1 ? `falta 1 día ${ev.texto||""}` : `faltan ${n} días ${ev.texto||""}`;
  cd.style.display="inline-block";
})();

/* ---------- día especial ---------- */
(function(){
  const mmdd=fechaHoy().slice(5);
  const esp=new Set(CONFIG.diasEspeciales||[]);
  if(CONFIG.aniversario) esp.add(CONFIG.aniversario.slice(5));
  if(!esp.has(mmdd)) return;
  document.body.classList.add("fiesta");
  document.getElementById("fiestaBadge").style.display="inline-block";
  const sky=document.getElementById("sky");
  if(sky && !document.body.classList.contains("with-image")){
    for(let i=0;i<26;i++){
      const s=document.createElement("span");
      s.className="st";
      const size=(Math.random()*1.8+1).toFixed(1);
      s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;`+
        `width:${size}px;height:${size}px;background:#E4B75B;`+
        `animation-delay:${(Math.random()*4).toFixed(1)}s;`+
        `animation-duration:${(2.5+Math.random()*3).toFixed(1)}s`;
      sky.appendChild(s);
    }
  }
})();

/* ---------- celebración (confetti + desbloqueo) ---------- */
function confetti(){
  for(let i=0;i<32;i++){
    const s=document.createElement("span");
    s.className="confetti-star";
    s.textContent=Math.random()<0.5?"✦":"★";
    s.style.left=(Math.random()*100)+"%";
    s.style.fontSize=(10+Math.random()*14)+"px";
    s.style.animationDuration=(1.6+Math.random()*2.2)+"s";
    s.style.animationDelay=(Math.random()*0.7)+"s";
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),5200);
  }
}
function celebrar(){
  confetti();
  try{ const au=new Audio(rutaAudio("win.wav")); au.volume=0.5; au.play().catch(()=>{}); }catch(e){}
  if(sellado){
    sellado=false;
    guardar("sello-"+fechaHoy(),"abierto");
    pintarCarta();
    const l=document.getElementById("letter");
    l.style.display="block";
    tipearCarta();
    if(l.scrollIntoView) l.scrollIntoView({behavior:"smooth",block:"center"});
  }
}

/* ---------- actividad del día ---------- */
const cont=document.getElementById("actividad");
if(act && act.tipo){
  document.getElementById("actLabel").style.display="flex";
  if(act.tipo==="video") montarVideo(act);
  if(act.tipo==="ahorcado") montarAhorcado(act.palabra);
  if(act.tipo==="sopa") montarSopa(act.palabras);
  if(act.tipo==="trivia") montarTrivia(act);
  if(act.tipo==="cupon") montarCupon(act);
  if(act.tipo==="foto") montarFoto(act);
  if(act.tipo==="mision") montarMision(act);
  if(act.tipo==="memoria") montarMemoria(act);
  if(act.tipo==="ruleta") montarRuleta(act);
  if(act.tipo==="rascar") montarRascar(act);
  if(act.tipo==="simon") montarSimon(act);
  if(act.tipo==="atrapar") montarAtrapar(act);
  if(act.tipo==="puzzle") montarPuzzle(act);
  if(act.tipo==="ppt") montarPpt(act);
  if(act.tipo==="mentira") montarMentira(act);
  if(act.tipo==="crucigrama") montarCrucigrama(act);
  if(act.tipo==="adivinanza") montarAdivinanza(act);
  if(act.tipo==="emojis") montarEmojis(act);
  if(act.tipo==="orden") montarOrden(act);
  if(act.tipo==="numero") montarNumero(act);
  if(act.tipo==="reaccion") montarReaccion(act);
  if(act.tipo==="topo") montarTopo(act);
  if(act.tipo==="cajafuerte") montarCajafuerte(act);
  if(act.tipo==="verdadfalso") montarVerdadFalso(act);
  if(act.tipo==="intruso") montarIntruso(act);
  if(act.tipo==="audio") montarAudio(act);
  if(act.tipo==="wordle") montarWordle(act);
  if(act.tipo==="nexos") montarNexos(act);
  if(act.tipo==="snake") montarSnake(act);
  if(act.tipo==="fotopuzzle") montarFotoPuzzle(act);
  if(act.tipo==="deslizante") montarDeslizante(act);
  if(act.tipo==="loro"){
    // día del loro: desaparecen el sobre, la carta y el "hoy toca"
    document.getElementById("envWrap").style.display="none";
    document.getElementById("letter").style.display="none";
    document.getElementById("actLabel").style.display="none";
    montarLoro(act);
  }
}

/* ===== memoria (memotest) ===== */
function montarMemoria(a){
  let emojis=(a.emojis&&a.emojis.length?a.emojis:["⭐","🎬","🍕","🌙","👻","🐨"]).slice(0,8);
  if(emojis.length<3) emojis=["⭐","🎬","🍕","🌙"];
  const cartas=[...emojis,...emojis].sort(()=>Math.random()-0.5);
  const cols = cartas.length<=12 ? 4 : 4;
  cont.innerHTML=`
    <div class="box">
      <p class="note">encontrá todas las parejas</p>
      <div id="memGrid" style="grid-template-columns:repeat(${cols},64px)"></div>
      <div class="result" id="memResult"></div>
    </div>`;
  const g=document.getElementById("memGrid");
  let abierta=null, bloqueo=false, hechas=0;
  cartas.forEach(e=>{
    const c=document.createElement("div");
    c.className="mem-card";
    c.textContent="✦";
    c.dataset.e=e;
    c.addEventListener("click",()=>{
      if(bloqueo||c.classList.contains("flip")||c.classList.contains("done")) return;
      c.classList.add("flip"); c.textContent=e;
      if(!abierta){ abierta=c; return; }
      if(abierta.dataset.e===e){
        abierta.classList.add("done"); c.classList.add("done");
        abierta.classList.remove("flip"); c.classList.remove("flip");
        abierta=null; hechas++;
        if(hechas===emojis.length){
          const r=document.getElementById("memResult");
          r.textContent="Todas las parejas. Qué memoria.";
          r.className="result ok";
          celebrar();
        }
      } else {
        bloqueo=true;
        const prev=abierta; abierta=null;
        setTimeout(()=>{
          prev.classList.remove("flip"); prev.textContent="✦";
          c.classList.remove("flip"); c.textContent="✦";
          bloqueo=false;
        },750);
      }
    });
    g.appendChild(c);
  });
}

  const stops=ops.map((_,i)=>`${colores[i%colores.length]} ${i*seg}deg ${(i+1)*seg}deg`).join(",");
  const yaKey="ruleta-"+fechaHoy();

    <div class="box">

        <div class="ruleta-pointer">▼</div>

      </div>
      <div class="ruleta-res" id="ruletaRes"></div>
      <button class="btn" id="ruletaBtn">Girar</button>
    </div>`;
  const wheel=document.getElementById("ruletaWheel");
  ops.forEach((o,i)=>{

    const lab=document.createElement("div");

    lab.innerHTML=`<span style="transform:rotate(${-ang}deg)">${o}</span>`;

  });

    wheel.style.transform=`rotate(${360-(idx+0.5)*seg}deg)`;
    res.textContent="Salió: "+ops[idx];
    btn.disabled=true; btn.textContent="Ya girada por hoy";
    return;
  }
  btn.addEventListener("click",()=>{
    btn.disabled=true;
    const idx=Math.floor(Math.random()*n);
    const destino=5*360 + (360-(idx+0.5)*seg);
    requestAnimationFrame(()=>{ wheel.style.transform=`rotate(${destino}deg)`; });
    const fin=()=>{
      wheel.removeEventListener("transitionend",fin);
      res.textContent="Salió: "+ops[idx];
      guardar(yaKey,String(idx));
      btn.textContent="Ya girada por hoy";
      celebrar();
    };
    wheel.addEventListener("transitionend",fin);
    setTimeout(fin,3800);
  });
}

/* ===== rascar ===== */
function montarRascar(a){
  const yaKey="rascar-"+fechaHoy();
  const ya=leer(yaKey)==="si";
  cont.innerHTML=`
    <div class="box">
      <p class="note">${ya?"ya lo revelaste, pero acá sigue:":"rascá con el dedo para revelar"}</p>
      <div class="rascar-wrap">
        <div class="rascar-premio">${a.premio||"✦"}</div>
        ${ya?"":'<canvas id="rascarCanvas"></canvas>'}
      </div>
    </div>`;
  if(ya) return;
  const cv=document.getElementById("rascarCanvas");
  const wrap=cv.parentElement;
  const terminar=()=>{
    guardar(yaKey,"si");
    cv.style.opacity="0";
    setTimeout(()=>cv.remove(),650);
    confetti(); celebrar();
  };
  let ctx=null;
  try{ ctx=cv.getContext("2d"); }catch(e){}
  if(!ctx){
    cv.remove();
    const b=document.createElement("button");
    b.className="btn"; b.textContent="Tocar para revelar";
    b.addEventListener("click",()=>{ b.remove(); terminar(); });
    wrap.parentElement.appendChild(b);
    return;
  }
  requestAnimationFrame(()=>{
    const dpr=window.devicePixelRatio||1;
    const W=wrap.offsetWidth, H=wrap.offsetHeight;
    cv.width=W*dpr; cv.height=H*dpr;
    ctx.scale(dpr,dpr);
    ctx.fillStyle="#8A7A5E";
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle="#6E6049";
    for(let i=0;i<40;i++) ctx.fillRect(Math.random()*W,Math.random()*H,3,3);
    ctx.fillStyle="#F6EFE2";
    ctx.font="600 15px "+getComputedStyle(document.body).getPropertyValue("--sans");
    ctx.textAlign="center";
    ctx.fillText("✦ rascá acá ✦", W/2, H/2+5);
    let rascando=false, trazos=0, listo=false;
    const raspar=(x,y)=>{
      ctx.globalCompositeOperation="destination-out";
      ctx.beginPath(); ctx.arc(x,y,17,0,Math.PI*2); ctx.fill();
      if(++trazos%10===0 && !listo){
        const img=ctx.getImageData(0,0,cv.width,cv.height).data;
        let vacios=0, total=0;
        for(let i=3;i<img.length;i+=40){ total++; if(img[i]<40) vacios++; }
        if(vacios/total>0.45){ listo=true; terminar(); }
      }
    };
    const pos=e=>{
      const r=cv.getBoundingClientRect();
      const t=e.touches?e.touches[0]:e;
      return [t.clientX-r.left, t.clientY-r.top];
    };
    const down=e=>{ rascando=true; raspar(...pos(e)); e.preventDefault(); };
    const move=e=>{ if(rascando){ raspar(...pos(e)); e.preventDefault(); } };
    const up=()=>{ rascando=false; };
    cv.addEventListener("touchstart",down,{passive:false});
    cv.addEventListener("touchmove",move,{passive:false});
    cv.addEventListener("touchend",up);
    cv.addEventListener("mousedown",down);
    cv.addEventListener("mousemove",move);
    window.addEventListener("mouseup",up);
  });
}

/* ===== simon (repetir la secuencia) ===== */
function montarSimon(a){
  const META=Math.min(15,Math.max(2,parseInt(a.rondas,10)||5));
  const COLS=["#E86A7C","#5FC49E","#6FA8DC","#E4B75B"];
  const SND=a.sonidos||{};
  /* sonido sin delay: se precargan y decodifican los audios UNA vez
     al abrir el juego, y se disparan desde memoria (latencia ~0) */
  let actx=null; const bufs={};
  (async function precargar(){
    try{
      actx=new (window.AudioContext||window.webkitAudioContext)();
      const lista=[["ok",rutaAudio(SND.acierto||"simon-ok.m4a")],["err",rutaAudio(SND.error||"simon-err.m4a")]];
      for(const [k,f] of lista){
        try{
          const r=await fetch(f);
          if(r.ok) bufs[k]=await actx.decodeAudioData(await r.arrayBuffer());
        }catch(e){}
      }
    }catch(e){}
  })();
  const sonar=t=>{
    const k=t==="ok"?"ok":"err";
    if(actx && bufs[k]){
      try{
        if(actx.state==="suspended") actx.resume();
        const s=actx.createBufferSource();
        s.buffer=bufs[k]; s.connect(actx.destination); s.start(0);
        return;
      }catch(e){}
    }
    // plan B si la precarga falló
    const f = rutaAudio(k==="ok" ? (SND.acierto||"simon-ok.m4a") : (SND.error||"simon-err.m4a"));
    try{ const au=new Audio(f); au.volume=0.55; au.play().catch(()=>{}); }catch(e){}
  };
  /* tonos clásicos del Simon original: cada pad tiene su nota
     (Mi3, La3, Do#4, Mi4 = acorde de La mayor), sintetizadas en vivo */
  const NOTAS=[164.81, 220.0, 277.18, 329.63];
  const tono=(i,dur)=>{
    try{
      if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
      if(actx.state==="suspended") actx.resume();
      const t0=actx.currentTime, seg=Math.max(0.1,dur/1000);
      const osc=actx.createOscillator(), g=actx.createGain();
      osc.type="square"; osc.frequency.value=NOTAS[i]||220;
      g.gain.setValueAtTime(0.0001,t0);
      g.gain.exponentialRampToValueAtTime(0.14,t0+0.015);
      g.gain.setValueAtTime(0.14,t0+seg-0.05);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+seg);
      osc.connect(g); g.connect(actx.destination);
      osc.start(t0); osc.stop(t0+seg+0.02);
    }catch(e){}
  };
  // velocidad: normal hasta la ronda 6; desde la 7 acelera 5% por ronda (7=5%, 8=10%, 9=15%, 10=20%)
  const velocidad=n=>1-0.05*Math.max(0,Math.min(n,10)-6);
  cont.innerHTML=`
    <div class="box">
      <div class="simon-ronda" id="siRonda"></div>
      <div id="simonPads"></div>
      <div class="result" id="siResult"></div>
      <button class="btn" id="siBtn">Empezar</button>
    </div>`;
  const pads=[];
  COLS.forEach((c,i)=>{
    const p=document.createElement("div");
    p.className="simon-pad"; p.style.background=c; p.dataset.i=i;
    document.getElementById("simonPads").appendChild(p);
    pads.push(p);
  });
  let seq=[], paso=0, esperando=false, jugando=false;
  const ronda=()=>{
    const v=velocidad(seq.length);
    document.getElementById("siRonda").textContent=
      `ronda ${seq.length} de ${META}`+(v<1?` · velocidad +${Math.round((1-v)*100)}%`:"");
  };
  const prender=(i,ms)=>new Promise(r=>{
    const v=velocidad(seq.length);
    tono(i,ms*v);
    pads[i].classList.add("lit");
    setTimeout(()=>{ pads[i].classList.remove("lit"); setTimeout(r,Math.round(140*v)); },Math.round(ms*v));
  });
  async function mostrar(){
    esperando=false;
    for(const i of seq) await prender(i,420);
    esperando=true; paso=0;
  }
  function ganar(){
    jugando=false; esperando=false;
    const r=document.getElementById("siResult");
    r.textContent="Secuencia completa. Impecable.";
    r.className="result ok";
    celebrar();
  }
  window._dbg=window._dbg||{}; window._dbg.simon={win:ganar, vel:velocidad};
  function perder(){
    jugando=false; esperando=false;
    sonar("error");
    const r=document.getElementById("siResult");
    r.textContent="Uy, no era ese. Probá de nuevo.";
    r.className="result bad";
    const b=document.getElementById("siBtn");
    b.style.display="inline-block"; b.textContent="Reintentar";
  }
  document.getElementById("siBtn").addEventListener("click",function(){
    if(actx && actx.state==="suspended") actx.resume();
    this.style.display="none";
    document.getElementById("siResult").textContent="";
    seq=[Math.floor(Math.random()*4)]; jugando=true; ronda(); mostrar();
  });
  pads.forEach(p=>p.addEventListener("click",async()=>{
    if(!jugando||!esperando) return;
    const i=parseInt(p.dataset.i,10);
    p.classList.add("lit"); setTimeout(()=>p.classList.remove("lit"),200);
    if(i!==seq[paso]){ perder(); return; }
    sonar("ok");
    paso++;
    if(paso===seq.length){
      if(seq.length>=META){ ganar(); return; }
      esperando=false;
      seq.push(Math.floor(Math.random()*4));
      ronda();
      setTimeout(mostrar,Math.round(650*velocidad(seq.length)));
    }
  }));
}

  document.getElementById("atBtn").addEventListener("click",function(){

    document.getElementById("atPts").textContent=`⭐ 0 / ${META}`;

      if(resta<=0) terminar(pts>=META);

  });
}

/* ===== puzzle deslizante ===== */
function montarPuzzle(){
  cont.innerHTML=`
    <div class="box">
      <p class="note">tocá una pieza al lado del hueco para moverla y ordenalas del 1 al 8</p>
      <div id="puzzleGrid"></div>
      <div class="result" id="pzResult"></div>
      <button class="btn" id="pzBtn">Mezclar de nuevo</button>
    </div>`;
  let board;
  function mezclar(){
    board=[1,2,3,4,5,6,7,8,0];
    let vacio=8, prev=-1;
    for(let m=0;m<90;m++){
      const x=vacio%3, y=Math.floor(vacio/3);
      const vecinos=[];
      if(x>0)vecinos.push(vacio-1); if(x<2)vecinos.push(vacio+1);
      if(y>0)vecinos.push(vacio-3); if(y<2)vecinos.push(vacio+3);
      const cand=vecinos.filter(v=>v!==prev);
      const el=cand[Math.floor(Math.random()*cand.length)];
      board[vacio]=board[el]; board[el]=0;
      prev=vacio; vacio=el;
    }
  }
  function pintar(){
    const g=document.getElementById("puzzleGrid");
    g.innerHTML="";
    board.forEach((v,i)=>{
      const t=document.createElement("div");
      t.className="pz-tile"+(v===0?" vacia":"");
      t.textContent=v===0?"":v;
      t.addEventListener("click",()=>mover(i));
      g.appendChild(t);
    });
  }
  function mover(i){
    const vacio=board.indexOf(0);
    const xi=i%3, yi=Math.floor(i/3), xv=vacio%3, yv=Math.floor(vacio/3);
    if(Math.abs(xi-xv)+Math.abs(yi-yv)!==1) return;
    board[vacio]=board[i]; board[i]=0;
    pintar();
    if(board.slice(0,8).every((v,k)=>v===k+1)){
      const r=document.getElementById("pzResult");
      r.textContent="Ordenado. Cerebrito.";
      r.className="result ok";
      celebrar();
    }
  }
  window._dbg=window._dbg||{};
  window._dbg.puzzle={set:(b)=>{board=b.slice();pintar();},mover};
  document.getElementById("pzBtn").addEventListener("click",()=>{
    document.getElementById("pzResult").textContent="";
    mezclar(); pintar();
  });
  mezclar(); pintar();
}

  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const d=document.createElement("div");
    d.className="cr-cell"+(usada[y][x]?"":" negra");
    d.style.width=cell+"px"; d.style.height=cell+"px";
    d.style.fontSize=fLetra+"px";
    if(usada[y][x]&&usada[y][x].num) d.innerHTML=`<span class="num" style="font-size:${fNum}px">${usada[y][x].num}</span>`;
    g.appendChild(d);
    celdas[x+","+y]=d;
  }
  const limpiarTxt=s=>String(s||"").toUpperCase().normalize("NFD").replace(/[\u0300-\u0308]/g,"").replace(/[^A-ZÑ]/g,"");
  let activa=0; const hechas=new Set();
  const pistasEl=[];
  defs.forEach((p,i)=>{
    const b=document.createElement("button");
    b.className="cr-pista"; b.textContent=`${i+1}. ${p.p} (${p.w.length} letras, ${p.d==="H"?"→":"↓"})`;
    b.addEventListener("click",()=>{ if(hechas.has(i))return; activa=i;
      pistasEl.forEach(x=>x.classList.remove("activa")); b.classList.add("activa");
      document.getElementById("crIn").focus(); });
    document.getElementById("crPistas").appendChild(b); pistasEl.push(b);
  });
  pistasEl[0].classList.add("activa");
  function probar(){
    if(hechas.has(activa)) return;
    const p=defs[activa];
    const r=document.getElementById("crResult");
    if(limpiarTxt(document.getElementById("crIn").value)===limpiarTxt(p.w)){
      hechas.add(activa);
      for(let i=0;i<p.w.length;i++){
        const cx=p.x+(p.d==="H"?i:0), cy=p.y+(p.d==="V"?i:0);
        const cel=celdas[cx+","+cy];
        cel.classList.add("llena");
        const num=cel.querySelector(".num");
        cel.textContent=p.w[i];
        if(num) cel.prepend(num);
      }
      pistasEl[activa].classList.remove("activa"); pistasEl[activa].classList.add("hecha");
      document.getElementById("crIn").value="";
      if(hechas.size===defs.length){
        r.textContent="¡Crucigrama completo! Nos sabés de memoria.";
        r.className="result ok"; celebrar();
      } else {
        r.textContent="¡Bien! Esa era."; r.className="result ok";
        const prox=defs.findIndex((_,i)=>!hechas.has(i));
        if(prox>=0){ activa=prox; pistasEl[prox].classList.add("activa"); }
      }
    } else { r.textContent="Mmm, no va ahí. Probá otra vez."; r.className="result bad"; }
  }
  document.getElementById("crBtn").addEventListener("click",probar);
  document.getElementById("crIn").addEventListener("keydown",e=>{ if(e.key==="Enter")probar(); });
  window._dbg=window._dbg||{}; window._dbg.cruci={defs,probar,setActiva:i=>activa=i,input:()=>document.getElementById("crIn")};
}

/* ===== ordenar la frase ===== */
function montarOrden(a){
  const frase=(a.frase||"TE AMO MUCHO").trim().split(/\s+/);
  function armar(){
    const mezcla=[...frase].sort(()=>Math.random()-0.5);
    if(frase.length>1 && mezcla.join(" ")===frase.join(" ")) return armar();
    return mezcla;
  }
  cont.innerHTML=`
    <div class="box">
      <p class="note">tocá las palabras en orden para armar la frase</p>
      <div class="orden-zona" id="orZona"></div>
      <div class="orden-chips" id="orChips"></div>
      <div class="result" id="orResult"></div>
      <button class="btn" id="orReset">Empezar de nuevo</button>
    </div>`;
  let elegidas=[];
  function pintar(rest){
    const z=document.getElementById("orZona"), c=document.getElementById("orChips");
    z.innerHTML=""; c.innerHTML="";
    elegidas.forEach((w,i)=>{
      const b=document.createElement("button"); b.className="orden-chip"; b.textContent=w;
      b.addEventListener("click",()=>{ elegidas.splice(i,1); rest.push(w); pintar(rest); });
      z.appendChild(b);
    });
    rest.forEach((w,i)=>{
      const b=document.createElement("button"); b.className="orden-chip"; b.textContent=w;
      b.addEventListener("click",()=>{
        rest.splice(i,1); elegidas.push(w); pintar(rest);
        if(!rest.length){
          const r=document.getElementById("orResult");
          if(elegidas.join(" ")===frase.join(" ")){
            r.textContent="Frase perfecta."; r.className="result ok"; celebrar();
          } else { r.textContent="Hmm, ese orden no era…"; r.className="result bad"; }
        }
      });
      c.appendChild(b);
    });
  }
  let resto=armar();
  document.getElementById("orReset").addEventListener("click",()=>{
    elegidas=[]; resto=armar();
    document.getElementById("orResult").textContent="";
    pintar(resto);
  });
  pintar(resto);
  window._dbg=window._dbg||{}; window._dbg.orden={frase, elegir:(w)=>{ [...document.getElementById("orChips").children].find(b=>b.textContent===w).click(); }};
}

/* ===== adivinar el número ===== */
function montarNumero(a){
  const MAX=Math.max(10,parseInt(a.max,10)||100);
  const TRIES=Math.max(3,parseInt(a.intentos,10)||7);
  let target, restan, fin;
  cont.innerHTML=`
    <div class="box">
      <p class="note">pensé un número del 1 al ${MAX}. Tenés <b id="nuRestan"></b> intentos.</p>
      <div class="juego-input">
        <input id="nuIn" type="number" min="1" max="${MAX}" placeholder="tu número…">
        <button class="btn" id="nuBtn">Probar</button>
      </div>
      <div class="result" id="nuResult"></div>
      <button class="btn" id="nuRetry" style="display:none">Otra vez</button>
    </div>`;
  function empezar(){
    target=1+Math.floor(Math.random()*MAX); restan=TRIES; fin=false;
    document.getElementById("nuRestan").textContent=restan;
    document.getElementById("nuResult").textContent="";
    document.getElementById("nuRetry").style.display="none";
    document.getElementById("nuIn").value="";
  }
  function probar(){
    if(fin) return;
    const v=parseInt(document.getElementById("nuIn").value,10);
    const r=document.getElementById("nuResult");
    if(!v||v<1||v>MAX){ r.textContent="Poné un número válido."; r.className="result bad"; return; }
    restan--; document.getElementById("nuRestan").textContent=restan;
    if(v===target){ fin=true; r.textContent=`¡${target}! Nos leemos la mente.`; r.className="result ok"; celebrar(); return; }
    if(restan<=0){ fin=true; r.textContent=`Era ${target}… la próxima seguro.`; r.className="result bad";
      document.getElementById("nuRetry").style.display="inline-block"; return; }
    r.textContent = v<target ? "Más grande ↑" : "Más chico ↓";
    r.className="result";
    document.getElementById("nuIn").value=""; document.getElementById("nuIn").focus();
  }
  document.getElementById("nuBtn").addEventListener("click",probar);
  document.getElementById("nuIn").addEventListener("keydown",e=>{ if(e.key==="Enter")probar(); });
  document.getElementById("nuRetry").addEventListener("click",empezar);
  empezar();
  window._dbg=window._dbg||{}; window._dbg.numero={get:()=>target};
}

/* ===== test de reacción ===== */
function montarReaccion(){
  const RONDAS=3, LIMITE=650;
  cont.innerHTML=`
    <div class="box">
      <p class="note">cuando la caja se ponga verde, tocala lo más rápido que puedas. ${RONDAS} rondas.</p>
      <div id="reacZona"><span id="reacTxt">tocá para empezar</span><span id="reacSub" style="font-size:.8rem;font-weight:600;color:var(--ink-soft)"></span></div>
      <div class="result" id="reacResult"></div>
    </div>`;
  const z=document.getElementById("reacZona");
  let estado="inicio", timer=null, t0=0, tiempos=[];
  const txt=(a,b)=>{ document.getElementById("reacTxt").textContent=a; document.getElementById("reacSub").textContent=b||""; };
  function esperar(){
    estado="esperando"; z.className="esperando"; z.id="reacZona";
    txt("esperá…", `ronda ${tiempos.length+1} de ${RONDAS}`);
    timer=setTimeout(()=>{ estado="listo"; z.classList.remove("esperando"); z.classList.add("listo"); txt("¡TOCÁ!"); t0=Date.now(); },900+Math.random()*2100);
  }
  function ganarR(){ 
    const r=document.getElementById("reacResult");
    const avg=Math.round(tiempos.reduce((s,x)=>s+x,0)/tiempos.length);
    if(avg<=LIMITE){ r.textContent=`Promedio ${avg}ms. Reflejos de gata.`; r.className="result ok"; celebrar(); }
    else { r.textContent=`Promedio ${avg}ms… casi. Tocá para reintentar.`; r.className="result bad"; }
    estado="inicio"; z.className=""; txt("tocá para empezar de nuevo");
    tiempos=[];
  }
  z.addEventListener("click",()=>{
    if(estado==="inicio"){ document.getElementById("reacResult").textContent=""; esperar(); return; }
    if(estado==="esperando"){ clearTimeout(timer); z.className=""; txt("¡muy pronto! tocá para reintentar la ronda"); estado="inicio2"; return; }
    if(estado==="inicio2"){ esperar(); return; }
    if(estado==="listo"){
      tiempos.push(Date.now()-t0);
      z.classList.remove("listo");
      if(tiempos.length>=RONDAS){ ganarR(); }
      else esperar();
    }
  });
  window._dbg=window._dbg||{}; window._dbg.reaccion={win:()=>{ tiempos=[200,200,200]; ganarR(); }};
}

/* ===== topo (whack-a-mole) ===== */
function montarTopo(a){
  const META=Math.max(5,parseInt(a.aciertos,10)||10), DUR=25;
  cont.innerHTML=`
    <div class="box">
      <div class="atrapar-hud"><span id="tpPts">🐹 0 / ${META}</span><span id="tpTiempo">${DUR}s</span></div>
      <div id="topoGrid"></div>
      <div class="result" id="tpResult"></div>
      <button class="btn" id="tpBtn">Jugar</button>
    </div>`;
  const g=document.getElementById("topoGrid");
  const hoyos=[];
  for(let i=0;i<9;i++){
    const h=document.createElement("button");
    h.className="topo-hoyo"; h.textContent="";
    h.addEventListener("click",()=>{
      if(!activo||h.textContent!=="🐹") return;
      pts++; h.textContent="💥";
      setTimeout(()=>{ if(h.textContent==="💥") h.textContent=""; },200);
      document.getElementById("tpPts").textContent=`🐹 ${pts} / ${META}`;
      if(pts>=META) terminar(true);
    });
    g.appendChild(h); hoyos.push(h);
  }
  let pts=0, resta=DUR, activo=false, spawner=null, reloj=null;
  function limpiar(){ clearInterval(spawner); clearInterval(reloj); activo=false; hoyos.forEach(h=>h.textContent=""); }
  function terminar(win){
    limpiar();
    const r=document.getElementById("tpResult");
    r.textContent = win ? "¡Los agarraste a todos!" : `${pts} de ${META}… se te escaparon.`;
    r.className="result "+(win?"ok":"bad");
    if(win) celebrar();
    else { const b=document.getElementById("tpBtn"); b.style.display="inline-block"; b.textContent="Reintentar"; }
  }
  window._dbg=window._dbg||{}; window._dbg.topo={win:()=>{pts=META;terminar(true);}};
  document.getElementById("tpBtn").addEventListener("click",function(){
    this.style.display="none";
    document.getElementById("tpResult").textContent="";
    pts=0; resta=DUR; activo=true;
    document.getElementById("tpPts").textContent=`🐹 0 / ${META}`;
    document.getElementById("tpTiempo").textContent=DUR+"s";
    spawner=setInterval(()=>{
      hoyos.forEach(h=>{ if(h.textContent==="🐹") h.textContent=""; });
      hoyos[Math.floor(Math.random()*9)].textContent="🐹";
    },720);
    reloj=setInterval(()=>{
      resta--; document.getElementById("tpTiempo").textContent=resta+"s";
      if(resta<=0) terminar(pts>=META);
    },1000);
  });
}

/* ===== cajafuerte (descifrar el código) ===== */
function montarCajafuerte(a){
  const CODE=String(a.codigo||"1234").replace(/\D/g,"");
  const L=CODE.length, MAXT=6;
  cont.innerHTML=`
    <div class="box">
      <p class="note">🔐 código de ${L} dígitos, ${MAXT} intentos.${a.pista?` Pista: <b>${a.pista}</b>`:""}</p>
      <div class="caja-intentos" id="cjIntentos"></div>
      <div class="juego-input">
        <input id="cjIn" type="tel" inputmode="numeric" maxlength="${L}" placeholder="${"•".repeat(L)}">
        <button class="btn" id="cjBtn">Probar</button>
      </div>
      <p class="note" style="margin-top:8px">🟩 dígito correcto en su lugar · 🟨 está pero en otro lugar</p>
      <div class="result" id="cjResult"></div>
      <button class="btn" id="cjRetry" style="display:none">Otra vez</button>
    </div>`;
  let usados=0, fin=false;
  function probar(){
    if(fin) return;
    const v=String(document.getElementById("cjIn").value||"").replace(/\D/g,"");
    const r=document.getElementById("cjResult");
    if(v.length!==L){ r.textContent=`Tienen que ser ${L} dígitos.`; r.className="result bad"; return; }
    usados++;
    const fila=document.createElement("div"); fila.className="caja-fila";
    const restoCode=CODE.split(""), marca=Array(L).fill("no");
    for(let i=0;i<L;i++) if(v[i]===CODE[i]){ marca[i]="ok"; restoCode[i]=null; }
    for(let i=0;i<L;i++) if(marca[i]==="no"){ const j=restoCode.indexOf(v[i]); if(j>=0){ marca[i]="casi"; restoCode[j]=null; } }
    for(let i=0;i<L;i++){
      const d=document.createElement("div");
      d.className="caja-dig"+(marca[i]==="ok"?" ok":marca[i]==="casi"?" casi":"");
      d.textContent=v[i]; fila.appendChild(d);
    }
    document.getElementById("cjIntentos").appendChild(fila);
    document.getElementById("cjIn").value="";
    if(v===CODE){ fin=true; r.textContent="🔓 ¡Abierta! Sabés demasiado."; r.className="result ok"; celebrar(); return; }
    if(usados>=MAXT){ fin=true; r.textContent="Se trabó la caja… reintentá."; r.className="result bad";
      document.getElementById("cjRetry").style.display="inline-block"; return; }
    r.textContent=`Intento ${usados} de ${MAXT}.`; r.className="result";
  }
  document.getElementById("cjBtn").addEventListener("click",probar);
  document.getElementById("cjIn").addEventListener("keydown",e=>{ if(e.key==="Enter")probar(); });
  document.getElementById("cjRetry").addEventListener("click",()=>montarCajafuerte(a));
  window._dbg=window._dbg||{}; window._dbg.caja={code:CODE,probar,input:()=>document.getElementById("cjIn")};
}

/* ===== verdad o falso ===== */
function montarVerdadFalso(a){
  const frases=(a.frases||[]).filter(f=>f&&f.t);
  if(frases.length<2){
    cont.innerHTML=`<div class="box"><p class="note">Faltan las frases de este juego en el CONFIG.</p></div>`;
    return;
  }
  let i=0, ok=0;
  cont.innerHTML=`
    <div class="box">
      <div class="vf-prog" id="vfProg"></div>
      <div class="vf-frase" id="vfFrase"></div>
      <div class="vf-btns">
        <button class="btn" id="vfV">Verdadero</button>
        <button class="btn" id="vfF" style="background:var(--key);color:var(--ink);border:1px solid var(--card-border)">Falso</button>
      </div>
      <div class="result" id="vfResult"></div>
      <button class="btn" id="vfRetry" style="display:none">Otra vez</button>
    </div>`;
  function pintar(){
    document.getElementById("vfProg").textContent=`${i+1} / ${frases.length}`;
    document.getElementById("vfFrase").textContent=frases[i].t;
  }
  function responder(v){
    if(i>=frases.length) return;
    if(v===!!frases[i].v) ok++;

    if(i<frases.length){ pintar(); return; }
    const r=document.getElementById("vfResult");
    document.getElementById("vfFrase").textContent="";
    document.getElementById("vfProg").textContent="";
    if(ok===frases.length){ r.textContent=`${ok}/${frases.length}. Perfecto, nos conocés entero.`; r.className="result ok"; celebrar(); }
    else { r.textContent=`${ok} de ${frases.length}… se puede mejorar 😏`; r.className="result bad";
      document.getElementById("vfRetry").style.display="inline-block"; }
  }
  document.getElementById("vfV").addEventListener("click",()=>responder(true));
  document.getElementById("vfF").addEventListener("click",()=>responder(false));
  document.getElementById("vfRetry").addEventListener("click",()=>montarVerdadFalso(a));
  pintar();
}

function montarIntruso(a){
  const PARES=[["🌚","🌝"],["😺","😸"],["🐶","🦊"],["🍪","🥮"],["⭐","🌟"],["💙","💜"],["🐻","🐨"],["🌸","💮"]];

      <p class="note" id="inNote"></p>

      <div class="result" id="inResult"></div>

  // el PRIMER audio de la lista suena una sola vez (presentación);
  // después los toques rotan en loop entre los demás

    if(intro){ intro=false; return players[0]; }
    const resto = players.length>1 ? players.slice(1) : players;
    if(!resto.length) return null;
    for(let t=0;t<resto.length;t++){
      const p=resto[idx%resto.length]; idx++;
      if(p) return p;

    return null;
